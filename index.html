<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Zoom Imports — Admin Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Plex Mono carries every chassis number, price and reference in this
         portal, and the PIN field. It was referenced in ~14 places but never
         loaded, so all of it fell back to the system monospace and drifted
         from the customer site. -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Nunito+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
    <!-- The sign-in backdrop. A CSS background is only discovered once the
         stylesheet has parsed; these start it in parallel. Split by the same
         breakpoint as the rule itself, so a phone never pulls the 1920 encode. -->
    <link rel="preload" as="image" href="/media/login-cx5-1920.webp" media="(min-width: 701px)">
    <link rel="preload" as="image" href="/media/login-cx5-1200.webp" media="(max-width: 700px)">
    <link rel="preload" as="image" href="/media/login-zoom-showroom.jpg">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
